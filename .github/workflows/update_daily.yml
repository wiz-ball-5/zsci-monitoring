name: Update daily OISST

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: zsci-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update near-real-time OISST
        run: python run_step3.py

      - name: Validate dashboard science
        run: python validate_step41.py

      - name: Commit updated operational data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/oisst_zsci_daily.csv \
            data/processed/oisst_zsci_monthly_monitor.csv \
            data/processed/current_zsci.json

          if git diff --cached --quiet; then
            echo "No operational data changes to commit."
          else
            git commit -m "data: update daily OISST $(date -u +%F)"
            git push
          fi
