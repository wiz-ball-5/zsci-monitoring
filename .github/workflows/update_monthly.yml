name: Update monthly climate data

on:
  workflow_dispatch:
  schedule:
    - cron: "43 19 12 * *"

permissions:
  contents: write

concurrency:
  group: zsci-monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh HadISST
        run: python run_step2.py --refresh

      - name: Refresh monthly OISST archive
        run: python build_oisst_monthly_history.py --refresh

      - name: Validate dashboard science
        run: python validate_step41.py

      - name: Commit updated monthly data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/hadisst_zsci_current_full.csv \
            data/processed/hadisst_zsci_manuscript_1950_2023.csv \
            data/processed/hadisst_zsci_climatology_1981_2010.csv \
            data/processed/oisst_zsci_monthly_history.csv \
            data/processed/oisst_zsci_monthly_history.meta.json \
            data/metadata/hadisst_source.json || true

          if git diff --cached --quiet; then
            echo "No monthly data changes to commit."
          else
            git commit -m "data: refresh monthly climate products $(date -u +%F)"
            git push
          fi
